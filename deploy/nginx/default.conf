# ============================================================================
#  Portal IA News — Proxy inverso (Nginx)
#  UN solo punto de entrada (puerto 80) que reparte a cada microservicio.
#
#  Se usa el DNS interno de Docker (127.0.0.11) con variables, para que Nginx
#  vuelva a resolver los nombres si un contenedor se recrea y cambia de IP.
#  (Sin esto, Nginx guardaría la IP vieja y daría "502 Bad Gateway".)
#
#  El "rewrite" es lo que borra el prefijo:
#     /auth/register    ->  auth:3001/register
#     /feeds/feed       ->  feeds:3002/feed
#     /agente/summarize ->  agente:3003/summarize
# ============================================================================

server {
    listen 80;
    server_name _;

    # Las noticias con imágenes pueden traer cuerpos grandes; la IA y las
    # descargas de modelos pueden tardar, así que damos un margen amplio.
    client_max_body_size 25m;
    proxy_read_timeout   1800s;
    proxy_send_timeout   1800s;

    # DNS interno de Docker: re-resuelve cada 10 s (evita IPs viejas tras recrear)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeceras que se pasan a los microservicios
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Chequeo rápido de que el PROXY está vivo (no mira los servicios) ---
    location = /proxy-health {
        add_header Content-Type text/plain;
        return 200 "ok - proxy nginx\n";
    }

    # ------------------------- Microservicios -------------------------
    location /auth/ {
        set $up_auth http://auth:3001;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $up_auth;
    }
    location /feeds/ {
        set $up_feeds http://feeds:3002;
        rewrite ^/feeds/(.*)$ /$1 break;
        proxy_pass $up_feeds;
    }
    location /agente/ {
        set $up_agente http://agente:3003;
        rewrite ^/agente/(.*)$ /$1 break;
        proxy_pass $up_agente;
    }

    # Atajos sin barra final (evita que caigan en el frontend)
    location = /auth   { return 301 /auth/;   }
    location = /feeds  { return 301 /feeds/;  }
    location = /agente { return 301 /agente/; }

    # ------------------- Frontend (todo lo demás) ---------------------
    location / {
        set $up_web http://web:8090;
        proxy_pass $up_web;
    }
}

# ============================================================================
#  Portal IA News — Proxy inverso (Nginx)
#  UN solo punto de entrada (puerto 80) que reparte a cada microservicio.
#
#  Incluye compresión (respuestas JSON más livianas), cabeceras de seguridad,
#  CSP y límites de peticiones por IP.
# ============================================================================

# Zonas de límite (deben estar en el contexto http; este archivo se incluye ahí).
limit_req_zone $binary_remote_addr zone=portal_api:10m rate=20r/s;
limit_req_status 429;

# No registrar códigos OAuth que viajan temporalmente en la query.
log_format portal_sin_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log portal_sin_query;

    client_max_body_size 25m;
    client_body_buffer_size 128k;

    # Compresión: las listas de noticias son JSON grande y se benefician mucho.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Cabeceras de seguridad. La CSP permite las imágenes externas de los RSS
    # y solo iframes de YouTube/Vimeo; el resto queda bloqueado.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # DNS interno de Docker: re-resuelve cada 10 s (evita IPs viejas tras recrear)
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # --- Chequeo rápido de que el PROXY está vivo (no mira los servicios) ---
    location = /proxy-health {
        add_header Content-Type text/plain;
        return 200 "ok - proxy nginx\n";
    }

    # ------------------------- Microservicios -------------------------
    location /auth/ {
        limit_req zone=portal_api burst=40 nodelay;
        set $up_auth http://auth:3001;
        rewrite ^/auth/(.*)$ /$1 break;
        proxy_pass $up_auth;
    }

    location /feeds/ {
        limit_req zone=portal_api burst=80 nodelay;
        set $up_feeds http://feeds:3002;
        rewrite ^/feeds/(.*)$ /$1 break;
        proxy_pass $up_feeds;
    }

    # Refrescar todas las fuentes puede tardar (descargas en paralelo).
    location = /feeds/refresh {
        limit_req zone=portal_api burst=10 nodelay;
        set $up_feeds http://feeds:3002;
        rewrite ^/feeds/(.*)$ /$1 break;
        proxy_pass $up_feeds;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Descargar un modelo puede tardar varios minutos: más margen solo aquí.
    location = /agente/model/pull {
        limit_req zone=portal_api burst=5 nodelay;
        set $up_agente http://agente:3003;
        rewrite ^/agente/(.*)$ /$1 break;
        proxy_pass $up_agente;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /agente/ {
        limit_req zone=portal_api burst=40 nodelay;
        set $up_agente http://agente:3003;
        rewrite ^/agente/(.*)$ /$1 break;
        proxy_pass $up_agente;
        # La IA local puede tardar; el agente corta a los 180 s.
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    # Atajos sin barra final (evita que caigan en el frontend)
    location = /auth   { return 301 /auth/;   }
    location = /feeds  { return 301 /feeds/;  }
    location = /agente { return 301 /agente/; }

    # ------------------- Frontend (todo lo demás) ---------------------
    location / {
        set $up_web http://web:8090;
        proxy_pass $up_web;
    }
}

# ============================================================================
#  Portal IA News — docker-compose
#  Levanta TODO el sistema en contenedores separados + el proxy Nginx:
#
#     navegador  ->  nginx (puerto 80)  ->  web    (frontend)
#                                       ->  auth   (login/JWT/perfil)
#                                       ->  feeds  (RSS/artículos/feed)
#                                       ->  agente (IA)  ->  ollama
#
#  Uso normal:   docker compose up -d --build
#  Abrir:        http://localhost
# ============================================================================

name: portal-ianews

x-seguridad: &seguridad
  init: true
  security_opt:
    - no-new-privileges:true
  restart: ${RESTART_POLICY:-no}
  stop_grace_period: 15s

x-app: &app
  <<: *seguridad
  build: .
  image: portal-ianews-app
  user: "1000:1000"
  cap_drop:
    - ALL

services:

  # --------- Prepara data/ aunque la borres (arranque en limpio) ----------
  # Docker crea el bind mount ./data como root cuando la carpeta no existe.
  # Como auth/feeds/agente corren con el usuario 1000, no podrían escribir.
  # Este contenedor de un solo uso la crea y le da el dueño correcto.
  init-datos:
    image: portal-ianews-app
    container_name: ianews-init
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /app/data/uploads && chown -R 1000:1000 /app/data && chmod 700 /app/data /app/data/uploads
    volumes:
      - ./data:/app/data
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ---------------- Proxy inverso: única puerta de entrada ----------------
  nginx:
    image: nginx:stable-alpine
    container_name: ianews-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:    { condition: service_healthy }
      auth:   { condition: service_healthy }
      feeds:  { condition: service_healthy }
      agente: { condition: service_healthy }
    init: true
    security_opt:
      - no-new-privileges:true
    restart: ${RESTART_POLICY:-no}
    stop_grace_period: 15s

  # ------------------------------- Frontend -------------------------------
  web:
    <<: *app
    container_name: ianews-web
    command: node web/index.js
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # --------------------- Microservicio: Auth (3001) ----------------------
  auth:
    <<: *app
    container_name: ianews-auth
    command: node services/auth/index.js
    depends_on:
      init-datos:
        condition: service_completed_successfully
    environment:
      - "JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en .env (generá uno con: openssl rand -hex 32)}"
      - TRUST_PROXY=1
    volumes:
      - ./data:/app/data
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # -------------------- Microservicio: Feeds (3002) ----------------------
  feeds:
    <<: *app
    container_name: ianews-feeds
    command: node services/feeds/index.js
    depends_on:
      init-datos:
        condition: service_completed_successfully
    environment:
      - "JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en .env (generá uno con: openssl rand -hex 32)}"
      - AGENT_URL=http://agente:3003        # habla con el agente por nombre de servicio
      - TRUST_PROXY=1
      - FEEDS_CONCURRENCIA=${FEEDS_CONCURRENCIA:-3}
      - RATE_FEEDS_MIN=${RATE_FEEDS_MIN:-180}
    volumes:
      - ./data:/app/data
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # ------------------- Microservicio: Agente IA (3003) -------------------
  agente:
    <<: *app
    container_name: ianews-agente
    command: node services/agent/index.js
    depends_on:
      init-datos:
        condition: service_completed_successfully
    environment:
      - "JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en .env (generá uno con: openssl rand -hex 32)}"
      - FEEDS_URL=http://feeds:3002         # habla con feeds por nombre de servicio
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - TRUST_PROXY=1
      # --- Rendimiento / GPU ---
      # num_batch más alto = procesa el prompt en tandas más grandes (usa más
      # VRAM). 128 es seguro en 2 GB; subí a 256/512 si tenés 6 GB o más.
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-128}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-4096}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-700}
      - OLLAMA_NUM_PREDICT_CLASIFICAR=${OLLAMA_NUM_PREDICT_CLASIFICAR:-160}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30s}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-180000}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      - TRAD_CONCURRENCIA=${TRAD_CONCURRENCIA:-4}
      - TRAD_CACHE_MAX=${TRAD_CACHE_MAX:-800}
      - RATE_AGENTE_MIN=${RATE_AGENTE_MIN:-120}
      - RATE_AGENTE_CARO_MIN=${RATE_AGENTE_CARO_MIN:-24}
    volumes:
      - ./data:/app/data
    expose: ["3003"]
    # Permite que el contenedor alcance un Ollama instalado en tu PC (ver .env)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # ---------------------- IA local (Ollama en contenedor) ----------------
  # Arranca "vacío": hay que bajar los modelos una vez con:
  #   ./portal.sh modelos
  # Para usar la GPU: ./portal.sh gpu
  ollama:
    image: ollama/ollama:latest
    container_name: ianews-ollama
    environment:
      # Un solo modelo en memoria y sin paralelismo (evita consumo desmedido).
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-32}
      # Descarga el modelo de la memoria al terminar (0 = inmediato).
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30s}
      # Cuantización de la caché KV + flash attention: menos VRAM por contexto.
      # Si tu versión de Ollama no las soporta, quitá estas dos líneas.
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE:-q8_0}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_LOAD_TIMEOUT=${OLLAMA_LOAD_TIMEOUT:-5m}
    volumes:
      - ollama_modelos:/root/.ollama
    expose: ["11434"]
    security_opt:
      - no-new-privileges:true
    restart: ${RESTART_POLICY:-no}

volumes:
  ollama_modelos:

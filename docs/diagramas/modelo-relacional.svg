<text x="800" y="597" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#172033">Sesiones y códigos se almacenan como hashes.</text>
<text x="800" y="642" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#172033">FK user_id → users.id dentro de Auth.</text>
<text x="800" y="784" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#475569">El JWT de acceso es autocontenido; no es una tabla adicional.</text>

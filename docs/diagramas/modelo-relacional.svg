<text x="45" y="1195" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#0f172a">auth.db y feeds.db son archivos independientes. No existe JOIN SQL entre servicios.</text>
<text x="45" y="1238" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#0f172a">ia.json no es una tabla relacional. El SQL publicado contiene solo esquema, sin datos personales.</text>
<text x="45" y="1282" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#0f172a">Detalle de tipos, defaults, índices y límites: docs/modelo-relacional.md y docs/database/*.sql</text>

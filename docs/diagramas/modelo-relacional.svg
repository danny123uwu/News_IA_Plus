<text x="50" y="1657" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#172033">Feeds mantiene referencias lógicas, sin FK declaradas. No hay FK entre los archivos auth.db y feeds.db.</text>
<text x="50" y="1704" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#172033">Unicidad: users.email y articles(source_id, link). Configuración IA privada: ia.json (no es tabla SQL).</text>
<text x="50" y="1751" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#172033">El SQL publicado contiene estructura sin filas. Diccionario y detalles: docs/modelo-relacional.md.</text>

<text x="1468" y="1215" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#0f172a">Google / MyMemory</text>
<text x="50" y="1154" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#0f172a">Modo nativo: Web :8090 y llamadas directas a localhost:3001–3003.</text>
<text x="50" y="1198" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#0f172a">Bases separadas por servicio. Las claves y bases reales NO forman parte del repositorio.</text>
<text x="50" y="1242" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#0f172a">IA local y API externa son alternativas; el respaldo local requiere autorización del usuario.</text>
